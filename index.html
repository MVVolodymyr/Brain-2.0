<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизація - Brain 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Вхід</h1>
        <form id="loginForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Увійти</button>
        </form>
        
        <!-- Message element for status updates -->
        <p id="message" style="margin-top: 15px; text-align: center; font-weight: bold;"></p>
    </div>

    <!-- Load AWS Amplify first -->
    <script src="https://unpkg.com/aws-amplify@latest/dist/aws-amplify.min.js"></script>
    <!-- Then load our login script (without module type) -->
    <script src="login.js"></script>
</body>
</html>
